    <script>
      (() => {
        try {
          const theme = localStorage.getItem('mk-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          const language = localStorage.getItem('mk-language') || (navigator.language.startsWith('fa') ? 'fa' : 'en');
          document.documentElement.dataset.theme = theme;
          document.documentElement.lang = language;
          document.documentElement.dir = language === 'fa' ? 'rtl' : 'ltr';
        } catch (_) {}
      })();
    </script>
